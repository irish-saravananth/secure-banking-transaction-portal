apiVersion: apps/v1
kind: Deployment

metadata:
  name: secure-banking-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secure-banking-app

  template:
    metadata:
      labels:
        app: secure-banking-app

    spec:
      containers:
      - name: secure-banking-app

        image: secure-banking-portal:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
