apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: secure-banking-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/irish-saravananth/secure-banking-transaction-portal.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
