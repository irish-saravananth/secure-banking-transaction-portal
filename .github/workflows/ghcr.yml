name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/secure-banking-portal:latest \
            -t ghcr.io/${{ github.repository_owner }}/secure-banking-portal:${{ github.sha }} .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/secure-banking-portal:latest
          docker push ghcr.io/${{ github.repository_owner }}/secure-banking-portal:${{ github.sha }}
