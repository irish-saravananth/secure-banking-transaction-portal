name: Security Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    name: Test, Scan and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit semgrep

      - name: Check Python syntax
        run: python -m compileall -q app tests run.py

      - name: Run security regression tests
        env:
          SECRET_KEY: ci-test-secret-key-12345678901234567890
          SESSION_COOKIE_SECURE: "false"
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/pytest-results.xml

      - name: Run Bandit SAST
        run: |
          bandit -r app -ll \
            -f json -o reports/bandit-report.json

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/python \
            --json \
            --output reports/semgrep-report.json \
            app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        run: |
          docker build \
            --tag secure-banking-portal:ci-${GITHUB_SHA} .

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: latest

      - name: Scan filesystem for vulnerabilities and secrets
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs venv \
            --skip-dirs .git \
            --skip-dirs evidence \
            --skip-dirs reports \
            --format json \
            --output reports/trivy-filesystem-report.json \
            .

      - name: Scan container image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output reports/trivy-image-report.json \
            "secure-banking-portal:ci-${GITHUB_SHA}"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-validation-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
