<!DOCTYPE html>
<html>
<head>
    <title>Transfer Money</title>
</head>
<body>

<h1>Transfer Money</h1>

<form method="POST">

    <label>Recipient Email</label><br>
    <input type="email"
           name="email"
           required>

    <br><br>

    <label>Amount</label><br>
    <input type="number"
           step="0.01"
           name="amount"
           required>

    <br><br>

    <button type="submit">
        Transfer
    </button>

</form>

<br>

<a href="/dashboard">
Back to Dashboard
</a>

</body>
</html>
